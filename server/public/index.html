<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yo-Vazaluza - Order Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1E1E2E;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .logo { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 32px; color: #D4A853; margin-bottom: 8px; }
    .subtitle { color: #9E9E9E; margin-bottom: 32px; font-size: 16px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 16px 24px;
      background: #2D2D3D;
      border-radius: 12px;
      color: #D4A853;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    a:hover { background: #3D3D4D; transform: translateY(-2px); }
    .desc { color: #9E9E9E; font-size: 13px; font-weight: 400; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍦</div>
    <h1>Yo-Vazaluza</h1>
    <p class="subtitle">Order Management Server</p>
    <div class="links">
      <a href="/kitchen">
        Kitchen Dashboard
        <span class="desc">View and manage incoming orders in real-time</span>
      </a>
      <a href="/api/health">
        API Health Check
        <span class="desc">Check server status and order count</span>
      </a>
    </div>
  </div>
</body>
</html>
